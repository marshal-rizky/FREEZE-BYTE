[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "freezebyte"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests==2.32.3",
    "python-dotenv==1.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["freezebyte*"]
