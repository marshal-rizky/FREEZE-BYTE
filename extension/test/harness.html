<!DOCTYPE html>
<html lang="id">
<head><meta charset="utf-8"><title>FREEZE BYTE harness</title>
<style>body{font:16px/1.6 Georgia,serif;max-width:640px;margin:40px auto;padding:0 16px}
.spacer{height:1400px}
/* Scrim full-halaman (mis. overlay cookie/login) yang menutupi lewat
   pseudo-element di body -- tidak aktif kecuali <html> diberi class
   "scrim", jadi ekspektasi default tidak berubah. */
html.scrim body::after { content:""; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:10; }
</style></head>
<body>
  <h1>Berita pasar</h1>
  <p id="p1">Saham <a id="lnk" href="#clicked">AAAA</a> naik tajam pekan ini. BBBB juga menguat, sementara CCCC tenang.</p>
  <p id="p2">BEI SUSPENSI SAHAM AAAA HARI INI</p>
  <p id="p3">BUMN dan RUPS tidak boleh terdeteksi.</p>
  <textarea>AAAA di dalam textarea tidak boleh terdeteksi</textarea>
  <!-- Kontainer dikolaps: tinggi 0, tersembunyi lewat visibility -- Range-nya
       tetap punya rect non-nol, tapi checkVisibility() induknya false. -->
  <div style="height:0; overflow:visible; visibility:hidden">AAAA tersembunyi</div>
  <!-- Ticker ini terlihat oleh checkVisibility() (span AAAA sendiri tidak
       disembunyikan) tapi ditutupi elemen lain yang benar-benar opak di
       atasnya (bukan turunan/leluhur span-nya) -- elementFromPoint harus
       menyaringnya. -->
  <p id="p5" style="position:relative">Ticker tertutup: <span id="ticker5">AAAA</span> di sini.
    <span id="cover" style="position:absolute; inset:0; background:#fff"></span>
  </p>
  <div class="spacer"></div>
  <p id="p4">Di bawah lipatan: AAAA sekali lagi.</p>
  <script>
    // Pengganti chrome.runtime untuk halaman uji: data dibaca dari fixtures.
    globalThis.chrome = { runtime: { getURL: (p) => p.replace(/^data\//, "fixtures/") } };
    document.addEventListener("DOMContentLoaded", () => {
      window.__bodyBefore = document.body.innerHTML;
    });
  </script>
  <script src="../src/detect.js"></script>
  <script src="../src/verdict.js"></script>
  <script src="../src/strip.js"></script>
  <script src="../src/overlay.js"></script>
  <script src="../src/schedule.js"></script>
  <script src="../src/content.js"></script>
</body>
</html>
